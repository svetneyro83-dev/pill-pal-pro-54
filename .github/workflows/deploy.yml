name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        # Добавляем флаг --force, чтобы точно установились все плагины Vite
        run: npm install --force 

      - name: Build
        # Собираем напрямую через npx, чтобы не зависеть от скриптов в package.json
        run: npx vite build --base=/pill-pal-pro-54/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
